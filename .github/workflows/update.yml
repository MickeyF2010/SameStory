name: Update site

on:
  schedule:
    - cron: "23 * * * *"     # every hour at 23 minutes past (UTC). Odd minute on purpose: GitHub skips or delays runs at busy times like :00
  workflow_dispatch:           # lets you run it by hand from the Actions tab
  push:                        # rebuilds automatically whenever you upload or edit files
    branches: [main]
    paths-ignore:
      - "**.md"

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python -m unittest discover -s tests

      # Keeps AI results between runs so unchanged stories cost nothing.
      - uses: actions/cache@v4
        with:
          path: data/cache.json
          key: ai-cache-${{ github.run_id }}
          restore-keys: ai-cache-

      - name: Build site
        run: python -m pipeline.run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site_out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
